<text x="1796" y="621.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="40" y="1136" font-size="15" font-weight="800" fill="#1d1a24" text-anchor="start">Flow:</text>
<text x="100" y="1136" font-size="14.5" font-weight="500" fill="#6b6676" text-anchor="start">1 Group sent to /api/plan</text>
<text x="320.0" y="1136" font-size="14.5" font-weight="500" fill="#6b6676" text-anchor="start">2 Agent calls Gemini with tools</text>
<text x="585.6" y="1136" font-size="14.5" font-weight="500" fill="#6b6676" text-anchor="start">3 Tools query Qloo</text>
<text x="752.4" y="1136" font-size="14.5" font-weight="500" fill="#6b6676" text-anchor="start">4 Plan checked against Qloo results</text>
<text x="1048.4" y="1136" font-size="14.5" font-weight="500" fill="#6b6676" text-anchor="start">5 Steps and plan stream back live</text>
<text x="1329.2" y="1136" font-size="14.5" font-weight="500" fill="#6b6676" text-anchor="start">6 Signed-in users save events (RLS)</text>
